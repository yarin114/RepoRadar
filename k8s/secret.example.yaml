# קובץ זה הוא תבנית בלבד — לא מכיל סודות אמיתיים, בטוח לשמור ב-git.
# הסוד האמיתי נוצר בפועל בטרמינל, ישירות מתוך .env, ולא נשמר כקובץ:
#
#   kubectl create secret generic reporadar-secrets `
#     --from-env-file=.env `
#     --namespace=reporadar
#
# זה יוצר Secret ששמו reporadar-secrets, עם כל המשתנים מ-.env בפנים —
# בלי שהתוכן האמיתי אי פעם נכתב לקובץ YAML שיכול להגיע ל-git בטעות.

apiVersion: v1
kind: Secret
metadata:
  name: reporadar-secrets
  namespace: reporadar
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "your-key-here"
  TELEGRAM_BOT_TOKEN: "your-token-here"
  TELEGRAM_AUTHORIZED_CHAT_ID: "your-chat-id-here"